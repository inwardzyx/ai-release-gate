# 持续集成：Java 单测 + 变异测试 + 判据脚本（离线部分）
#
# ★ 先写这份 CI 的理由和另两个仓库一样：简历上写"三个仓库均有 CI"时，
#   没有可点开的徽章，这句话**与编造不可区分**。CI 是给"我说的话"盖章，不是工程洁癖。
#
# ★ 哪些进 CI、哪些不进（刻意取舍，写在文件里而不是靠人记）：
#   进：mvn test（16 条单测，H2 内存库，不连 MySQL）、变异测试（改坏实现必须变红）、
#       compose 配置静态校验（不启动容器，避免 runner 上跑 MySQL/Redis 的抖动）。
#   不进：跑真评测（要 campus + DeepSeek key + 几十秒/题）、compose 起全栈跑判据
#       —— 前者需要 secret（不愿把 key 放进别人的日志），后者在公开 runner 上不稳定。
#       这两件事的证据在 README 的判据表里，用本地命令复现。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: java (mvn test + 变异)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # -B 非交互；-ntp 只打必要行（否则依赖下载日志刷屏，真正的失败被埋掉）
      - name: Unit tests
        run: mvn -B -ntp test

      - name: Upload surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire
          path: '**/target/surefire-reports/*'

      # ★ 变异测试：把实现改坏，确认单测会红。CI 里跑它是为了防"测试退化成永远绿"。
      - name: Mutation check（改坏实现必须变红）
        run: python scripts/mutate_tests.py

  compose-lint:
    name: compose 静态校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose -f deploy/docker-compose.yml config > /dev/null
