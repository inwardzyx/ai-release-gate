server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: gate-svc

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/arg_gate?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:arg}
    password: ${DB_PASSWORD:arg_dev_2026}
    hikari:
      maximum-pool-size: 6
      minimum-idle: 1
      pool-name: gate-svc-pool

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      timeout: 800ms

arg:
  stream:
    release-events: ${RELEASE_EVENTS_STREAM:arg:releases}
    group: ${STREAM_GROUP:gate}
    consumer: ${STREAM_CONSUMER:gate-1}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    com.arg: INFO
